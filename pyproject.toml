[project]
name = "rag-kb"
version = "0.1.0"
description = "RAG Knowledge Base MCP-сервер: локальная база знаний с Corrective RAG на LangGraph"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-ollama>=0.2",
    "langchain-text-splitters>=0.3",
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_kb"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["sample_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
