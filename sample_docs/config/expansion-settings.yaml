# =============================================================================
# «Трон Пепла» — конфигурация тестовых сборок дополнения
# Сборка: 0.9.4 (текущая). Порядок истины: правки идут из config/ в data/
# и только потом в таблицы balance/ (см. README, раздел «Правила ведения базы»).
#
# Файл читают:
#   - сборочный стенд дополнения (балансовые множители, флаги фич, пути ассетов);
#   - генератор выгрузок data/ (tools/docgen.md) — числа ниже обязаны совпадать
#     с data/creature-stats.json и balance/creature-stats.md;
#   - тестировщики (профили тестовых сборок и пороги сложности).
#
# Правила чисел (едины для всей базы):
#   - урон пишется цифрами через дефис («40-63»), словесная форма не индексируется;
#   - проценты — цифрами со знаком («25%»), цены — целым числом золота;
#   - единственная разрешённая дробь — курс слитка обсидиана.
#
# Приросты изменению не подлежат: они зафиксированы Гарнизонным уставом 908 года
# и переписью 909-го, и баланс не имеет права менять их так же, как дату Битвы
# у Трёх Кратеров. Последний предлагавший правку приростов ведёт реестр питомников.
# =============================================================================

meta:
  expansion: "Трон Пепла"
  build: "0.9.4"
  channel: "test"
  schema_version: 2
  language: "ru"
  encoding: "utf-8"
  related_files:
    - "balance/creature-stats.md"       # эталон чисел существ, сверка 0.9.4
    - "data/creature-stats.json"        # машиночитаемая выгрузка тех же чисел
    - "config/town.json"                # конфиг фракции: рельеф, цены найма
    - "config/difficulty.json"          # пороги сложности и модификаторы ИИ
    - "config/events.json"              # сценарные события кампании
  naming_sync_rule: "Переименование сущностей требует синхронной правки глоссария README"

# -----------------------------------------------------------------------------
# Профили тестовых сборок. Ночь сборки: множители применяются к каноническим
# числам из balance/creature-stats.md; канон не варьируется вечно — только в
# рамках профиля, чтобы плейтест можно было воспроизвести и откатить.
# -----------------------------------------------------------------------------
test_builds:
  - id: "nightly"
    purpose: "ночная автосборка; быстрые смоук-тесты правил"
    balance_overrides: {}                # канон без множителей
    feature_flags: "all_on"
    maps: ["smoke-01", "smoke-02"]
  - id: "playtest-wave-12"
    purpose: "плейтест волны 12: проверка коридора апгрейдов 30-45%"
    balance_overrides:
      upgrade_corridor_min: 0.30
      upgrade_corridor_max: 0.45
      dragon_exception: true             # дельта дракона вне коридора — осознанное исключение
    feature_flags: "all_on"
    maps: ["arena-ash", "siege-caldera", "hunt-harpies"]
  - id: "rc-094"
    purpose: "релиз-кандидат 0.9.4; сверка чисел с переписью 909 года"
    balance_overrides: {}
    feature_flags: "release_set"
    maps: ["mp-01" ,"mp-02", "mp-03", "mp-04", "mp-05", "mp-06"]

# -----------------------------------------------------------------------------
# Балансовые множители и боевые правила. Числа канона продублированы из
# data/creature-stats.json — рассинхронизация считается ошибкой сборки.
# -----------------------------------------------------------------------------
balance:
  global:
    stat_scale: 1.0                      # тестовый множитель статов; в релизе всегда 1.0
    price_scale: 1.0                     # множитель цен найма
    cheap_base_premium_top: true         # уровни 1-3 дешевле эталона на 15-20%, уровни 6-7 дороже на 10-15%
  upgrade_corridor:
    min_gain: 0.30                       # суммарная прибавка силы от апгрейда, нижняя граница
    max_gain: 0.45                       # верхняя граница; иначе апгрейд либо обязателен, либо бессмыслен
    exceptions: ["drakon_glubinnogo_zhara"]  # оформлена ограничениями, не числами
  combat_rules:
    ash_veil_dodge: 0.25                 # «Пепельная завеса»: 25% уклонения; 30% — конец честности, 20% — украшение
    first_strike_requires_stationary: true   # право первого удара Чёрного молота: только из неподвижного строя
    fire_immunity_full: ["lavovyi_drakon", "drakon_glubinnogo_zhara"]
    hot_scales_reflect_damage: 5         # жаркая чешуя: 5 урона за каждый удар атакующего в ближнем бою
    memory_of_faces_bonus: 2             # +2 урона по обидчику хозяина; не стакается, обнуляется 1-го числа месяца
    battle_line_bonus_per_turn: 1        # Молот: +1 урон за ход в строю без перемещения
    battle_line_bonus_cap: 3
    golem_magic_resist: 0.25             # «полустекло» обсидиановых големов
    veil_covers_adjacent_ranks: true     # Гарпия-завесница расширяет завесу на соседние ряды
    ram_first_swing: true                # загривок Жаровой угольницы: ворота с первого удара
  rounding:
    repair_discount: "up"                # скидка Орна: 37,6 → 38, «лучше переплатить меди, чем недоплатить камню»
    percent_format: "25%"                # проценты со знаком; цены — целые

# -----------------------------------------------------------------------------
# Ремонт големов — число-легенда: 47 золота за ХП, не менялось с 0.7.3.
# -----------------------------------------------------------------------------
repair:
  golem:
    price_per_hp: 47
    unchanged_since: "0.7.3"
    full_obsidian_golem: 2350            # 50 ХП; почти цена нового при сдаче обломков в зачёт
    half_obsidian_golem: 1175
    heal_spells_allowed: false           # голем не лечится и не воскрешается — только чинится за золото
    orn_discount: 0.20
    orn_price_per_hp: 38                 # 47 × 0,8 = 37,6, округление вверх
    orn_full_repair: 1900

# -----------------------------------------------------------------------------
# Экономика города: приросты устава 908 года, слиток обсидиана, дракон.
# -----------------------------------------------------------------------------
economy:
  growth_per_week:                       # правка приростов не принимается вовсе
    tier1: 14
    tier2: 9
    tier3: 7
    tier4: 6
    tier5: 4
    tier6: 3
    tier7: 1
    academy: 2                           # особое жилище; прирост не складывается с бонусами города
  weekly_totals:
    heads: 46
    gold: 7770
    ingots: 1                            # дракон стоит треть недельного бюджета — «дракон-решение»
  obsidian:
    ingot_city_rate: 250                 # курс внутри города, сборка 0.9.4
    ingot_traders_rate: 180              # у эрафийских торговцев; разница — риск перевозки через гряду
    adventure_market_buy: false          # слитки нельзя купить на рынке приключений — только продать
    sell_penalty: "потеря трети против городского курса"
    source: "плавни Лавового порта (лов тлеющего угря поднимает обсидиановые наросты)"
  dragon_hire:
    lavovyi_drakon: {gold: 2400, ingots: 1, effective_gold: 2650}
    drakon_glubinnogo_zhara: {gold: 3200, ingots: 2, effective_gold: 3700}
    free_contract_ingots: 72             # сезонный контракт «гость», кампания; эффективно 18000 городским курсом
    double_hire_per_week_banned: true    # мультиплеер, с 0.9.4

