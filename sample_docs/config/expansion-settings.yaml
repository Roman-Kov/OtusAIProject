    name: "«Сердце Кальдеры»"
    effects: {magic_power: 7, knowledge: 2}
    campaign_only: true
    map_substitute: "тусклая копия без бонуса к знаниям"
  regalia_of_ash:
    name: "Набор «Регалии Пепла»"
    items: ["венец", "перстень", "плащ", "секира"]
    full_set_bonus: "+15% огненного урона"
    multiplayer_limit: "один комплект на игрока"
    stacking_rules_ref: "data/artifacts.json (схема v2, сборка 0.9.2)"

# -----------------------------------------------------------------------------
# Кампания «Огонь и Прах»: 7 миссий, 889-907 годы.
# -----------------------------------------------------------------------------
campaign:
  name: "Огонь и Прах"
  missions: 7
  timeline:
    - {n: 1, id: "shadows-over-mines", name: "«Тени над копями»", period: "889", event: "разведка и оборона обсидиановых копей"}
    - {n: 2, id: "black-harvest", name: "«Чёрная жатва»", period: "890", event: "вторжение нежити в Стеклянный лес"}
    - {n: 3, id: "oath-of-hammer", name: "«Присяга молота»", period: "897", event: "прорыв лавы и союз с Магнусом Чёрным Молотом"}
    - {n: 4, id: "three-craters", name: "«Три Кратера»", period: "903", event: "Битва у Трёх Кратеров, 14 октября 903 года"}
    - {n: 5, id: "ash-winter", name: "«Пепельная зима»", period: "903-904", event: "эвакуация Затенённого яруса"}
    - {n: 6, id: "windwinged", name: "«Ветрокрылая»", period: "906-907", event: "экспедиция Лиары через Трёхкратную гряду"}
    - {n: 7, id: "ash-throne", name: "«Трон Пепла»", period: "907", event: "открытие прохода и совет пяти народов"}
  hardest_by_timing: [3, 6]             # третья и шестая — строгие тайминги
  largest_map: 4
  events_ref: "config/events.json"
  guest_dragon:
    enabled: true
    contract_ingots: 72                  # «гость»: кампанейский слой, на стратегию не переносится

# -----------------------------------------------------------------------------
# Флаги фич. Переключение флага не меняет канон чисел — только их применение.
# -----------------------------------------------------------------------------
features:
  academy_outside_pyramid: true          # решение 0.9.0, «маг — это разговор, а не строй»
  growth_locked: true                    # устав 908 года
  ingot_sell_only: true                  # рынок приключений не продаёт слитки
  harpy_cap_by_agreement: true           # потолок численности гарпий — дипломатия, не стройка
  dragon_is_decision: true               # «дракон — не покупка, а решение»
  dry_swarm_forecast: true               # «сухой рой» искровиков как погодный прогноз
  korostel_forecast: true                # вторая строка прогноза: поёт за шесть часов до фронта
  moth_light_marker: true                # пепельная моль метит старые руса лавы

# -----------------------------------------------------------------------------
# Пути ассетов сборки. Имена — латиницей, содержимое — локализуется.
# -----------------------------------------------------------------------------
assets:
  root: "assets/"
  creatures_sprites: "assets/creatures/"
  creature_portraits: "assets/portraits/"
  town_buildings: "assets/town/caldera/"
  campaign_maps: "maps/campaign/"
  multiplayer_maps: "maps/mp/"
  sounds: "assets/sounds/"
  naming_convention: "snake_case id существа совпадает с id из data/creature-stats.json"
  lava_dragon_sprite: "assets/creatures/lavovyi_drakon/AVWDrLv0.def"
  obsidian_golem_sprite: "assets/creatures/obsidianovyi_golem/AVWGolOb0.def"
  palette_note: "палитра Кальдеры: остекловевший чёрный, жар, пепел; сверка — tools/palette-check (внешний репозиторий стенда)"

# -----------------------------------------------------------------------------
# Локализация. data/ и balance/ двуязычны, lore/ пока только на русском.
# -----------------------------------------------------------------------------
localization:
  default_language: "ru"
  bilingual_sections: ["data", "balance"]
  ru_only_sections: ["lore", "guides"]
  string_counts:
    ru: 4128
    en: 1731
  term_base: "глоссарий README; термины не переводятся дословно: «Пепельная завеса» — Ash Veil, слиток — ingot"
  rename_requires_glossary_sync: true    # «Обсидианный голем» → «Обсидиановый голем» (0.6.2) — прецедент

# -----------------------------------------------------------------------------
# Пороги сложности для тестовых профилей (релизные — config/difficulty.json).
# -----------------------------------------------------------------------------
difficulty_test_profiles:
  easy:
    ai_aggression: 0.8
    neutral_growth: 0.9
  normal:
    ai_aggression: 1.0
    neutral_growth: 1.0
  hard:
    ai_aggression: 1.2
    neutral_growth: 1.1
  notes: "тестовые множители; канон сложности ИИ живёт в config/difficulty.json"

