  ruler: "Владычица Пепла Исольда"
  tiers: ["Кузнечный ярус", "Лавовый порт", "Затенённый ярус"]
  dwellings:
    tier1: "Кресальный навес"
    tier2: "Городская кошара"
    tier3: "Егерский питомник"
    tier4: "Вербовочный двор"
    tier5: "Големная печь"
    tier6: "Гнездовой навес"
    tier7: "Горн зова"
    special: "Академия огня"             # вне пирамиды по решению Флавии Двухфитильной
  caps:
    harpies_per_week: 3                  # потолок соглашения, не стройки: «город не обманывает в счёте тех, кто не обманывает в погоде»
    academy_upgrades: false              # жилище Академии не улучшается постройками
  academy_notes:
    - "прирост 2 не складывается ни с какими бонусами города"
